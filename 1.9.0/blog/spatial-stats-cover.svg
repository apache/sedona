<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="On a light map canvas, a field of grid cells with one glowing statistically significant hotspot, above the title: Your map has hotspots. Prove it.">
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#faf7f0"/><stop offset="1" stop-color="#f3ede0"/></linearGradient>
<radialGradient id="hotglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff7a3d" stop-opacity="0.35"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></radialGradient>
</defs>

<rect width="1280" height="720" fill="url(#paper)"/>

<!-- ===== TOP: the hotspot field (visual only, no text overlay) ===== -->
<!-- graticule -->
<g stroke="#b9c2d8" stroke-opacity="0.45" stroke-width="1">
<line x1="160" y1="0" x2="160" y2="470"/><line x1="320" y1="0" x2="320" y2="470"/><line x1="480" y1="0" x2="480" y2="470"/><line x1="640" y1="0" x2="640" y2="470"/><line x1="800" y1="0" x2="800" y2="470"/><line x1="960" y1="0" x2="960" y2="470"/><line x1="1120" y1="0" x2="1120" y2="470"/>
<line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="360" x2="1280" y2="360"/></g>

<!-- glow under the hot cluster -->
<ellipse cx="855" cy="225" rx="240" ry="185" fill="url(#hotglow)"/>

<!-- cool/neutral cells (z <= 0) -->
<g>
<rect x="86" y="66" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.75"/>
<rect x="150" y="120" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.9"/>
<rect x="212" y="70" width="24" height="24" rx="5" fill="#5a7fbf" opacity="0.7"/>
<rect x="120" y="212" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.8"/>
<rect x="238" y="170" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.75"/>
<rect x="300" y="120" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.95"/>
<rect x="332" y="230" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.7"/>
<rect x="196" y="300" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.85"/>
<rect x="88" y="352" width="24" height="24" rx="5" fill="#5a7fbf" opacity="0.7"/>
<rect x="278" y="368" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.8"/>
<rect x="388" y="60" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.7"/>
<rect x="420" y="168" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.9"/>
<rect x="452" y="300" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.75"/>
<rect x="392" y="392" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.75"/>
<rect x="520" y="96" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.8"/>
<rect x="560" y="220" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.8"/>
<rect x="510" y="330" width="24" height="24" rx="5" fill="#5a7fbf" opacity="0.75"/>
<rect x="610" y="380" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.8"/>
<rect x="648" y="120" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.7"/>
<rect x="688" y="270" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.85"/>
<rect x="1120" y="90" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.8"/>
<rect x="1160" y="210" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.75"/>
<rect x="1108" y="330" width="24" height="24" rx="5" fill="#2a6fd4" opacity="0.9"/>
<rect x="1190" y="400" width="24" height="24" rx="5" fill="#5a7fbf" opacity="0.7"/>
<rect x="1052" y="420" width="24" height="24" rx="5" fill="#8a8ea0" opacity="0.75"/>
</g>

<!-- warm shoulder cells -->
<g>
<rect x="742" y="145" width="26" height="26" rx="5" fill="#e8804d" opacity="0.85"/>
<rect x="920" y="135" width="26" height="26" rx="5" fill="#e8804d" opacity="0.8"/>
<rect x="962" y="245" width="26" height="26" rx="5" fill="#e2683a" opacity="0.9"/>
<rect x="736" y="285" width="26" height="26" rx="5" fill="#e2683a" opacity="0.85"/>
