<rect x="920" y="325" width="26" height="26" rx="5" fill="#e8804d" opacity="0.75"/>
</g>

<!-- significant hotspot core -->
<g stroke="#fffdf6" stroke-width="2.5">
<rect x="794" y="172" width="38" height="38" rx="6" fill="#d64518"/>
<rect x="838" y="168" width="38" height="38" rx="6" fill="#ef5a24"/>
<rect x="884" y="180" width="38" height="38" rx="6" fill="#d64518"/>
<rect x="804" y="216" width="38" height="38" rx="6" fill="#f0662e"/>
<rect x="850" y="212" width="38" height="38" rx="6" fill="#e04a15"/>
<rect x="894" y="226" width="38" height="38" rx="6" fill="#d64518"/>
<rect x="826" y="260" width="38" height="38" rx="6" fill="#d64518"/>
<rect x="870" y="268" width="38" height="38" rx="6" fill="#ef5a24"/>
</g>

<!-- z-score callout -->
<circle cx="866" cy="232" r="92" fill="none" stroke="#7a4a28" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.75"/>
<line x1="950" y1="172" x2="984" y2="140" stroke="#7a4a28" stroke-width="1.4"/>
<text x="996" y="130" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" font-weight="700" fill="#3a2418">z = 14.9</text>
<text x="996" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#7a5c48">p &#8776; 0 &#183; not luck</text>

<!-- legend strip -->
<g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="21">
<rect x="88" y="420" width="24" height="24" rx="5" fill="#2a6fd4"/><text x="122" y="440" fill="#3a3648">cold</text>
<rect x="206" y="420" width="24" height="24" rx="5" fill="#8a8ea0"/><text x="240" y="440" fill="#3a3648">noise</text>
<rect x="342" y="420" width="24" height="24" rx="5" fill="#d64518"/><text x="376" y="440" fill="#3a3648">hotspot &#183; 99% significant</text>
</g>

<!-- ===== BOTTOM: title band ===== -->
<rect x="0" y="470" width="1280" height="250" fill="#fffdf6"/>
<line x1="0" y1="470" x2="1280" y2="470" stroke="#ddd2bd" stroke-width="1.5"/>

<text x="72" y="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="5" fill="#c05a10">APACHE SEDONA · SPATIAL STATISTICS</text>
<text x="70" y="596" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800" fill="#241a20">Your map has hotspots. <tspan fill="#e04a15">Prove it.</tspan></text>
<text x="72" y="642" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#5a4e5c">Moran&#8217;s I &#183; Getis-Ord Gi* &#183; DBSCAN &#183; Local Outlier Factor — distributed, as Sedona DataFrames.</text>

<g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">
<rect x="72" y="662" width="486" height="46" rx="9" fill="#f4eddd" stroke="#d9cdb4" stroke-width="1.4"/>
<text x="92" y="693" fill="#0f766e">from sedona.spark.stats <tspan fill="#7c3aed">import</tspan> <tspan fill="#b45309">*</tspan></text>
</g>
<text x="592" y="693" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6e6276">clusters &#183; hotspots &#183; outliers &#183; autocorrelation — at any scale</text>
</svg>
