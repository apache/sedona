# Publishes master's -SNAPSHOT Maven artifacts to the ASF snapshot repository
# (https://repository.apache.org/content/repositories/snapshots) on every
# merge, so downstream projects can build and test against unreleased Sedona.
# This automates the manual steps in docs/community/snapshot.md.
name: Publish snapshot

on:
  push:
    branches:
      - master
    paths:
      - 'common/**'
      - 'spark/**'
      - 'spark-shaded/**'
      - 'flink/**'
      - 'flink-shaded/**'
      - 'snowflake/**'
      - 'shade-proto/**'
      - 'pom.xml'
      - '.github/workflows/publish-snapshot.yml'
  workflow_dispatch:

env:
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=60
  DO_NOT_TRACK: true

permissions:
  contents: read

# One publish at a time: a newer merge queues behind a running publish instead
# of cancelling it half-way through its uploads.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'apache/sedona'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # The POM deploys the shared modules (sedona-parent, common, flink,
      # snowflake) only from the Spark 3.5 / Scala 2.12 build, so the four
      # builds publish disjoint artifacts and can run in parallel. The Java
      # versions match the release process in docs/community/publish.md.
      matrix:
        include:
          - spark: '3.5'
            scala: '2.12'
            jdk: '11'
          - spark: '3.5'
            scala: '2.13'
            jdk: '11'
          - spark: '4.0'
            scala: '2.13'
            jdk: '17'
          - spark: '4.1'
            scala: '2.13'
            jdk: '17'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.jdk }}
          # Writes a settings.xml server entry for the ASF snapshot repository,
          # the id the org.apache:apache parent POM deploys snapshots to. The
          # username and password are read from these environment variables.
          server-id: apache.snapshots.https
          server-username: NEXUS_USER
          server-password: NEXUS_PW
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Check the version is a snapshot
        run: |
          VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Project version: ${VERSION}"
          if [[ "${VERSION}" != *-SNAPSHOT ]]; then
            echo "::error::${VERSION} is not a -SNAPSHOT version; refusing to publish it as a snapshot"
            exit 1
          fi
      - name: Publish Spark ${{ matrix.spark }} / Scala ${{ matrix.scala }}
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PW: ${{ secrets.NEXUS_PW }}
          SPARK: ${{ matrix.spark }}
          SCALA: ${{ matrix.scala }}
        run: |
          if [[ -z "${NEXUS_USER}" || -z "${NEXUS_PW}" ]]; then
            echo "::error::The NEXUS_USER and NEXUS_PW secrets are not available to this repository; ask ASF Infra to grant them"
            exit 1
          fi
          mvn -B -q deploy -DskipTests -Dspark="${SPARK}" -Dscala="${SCALA}"
