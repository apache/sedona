name: Docs build
on:
  push:
    branches:
      - master
      - branch-*

  pull_request:
    branches:
      - '*'

permissions:
  contents: write

env:
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[credential-persistence]
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: Compile JavaDoc
        run: mvn -q clean install -DskipTests && mkdir -p docs/api/javadoc/spark && cp -r spark/common/target/apidocs/* docs/api/javadoc/spark/
      - name: Compile ScalaDoc
        run: mvn generate-sources scala:doc -pl !common,!snowflake,!flink && mkdir -p docs/api/scaladoc/spark && cp -r spark/common/target/site/scaladocs/* docs/api/scaladoc/spark
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'docs-overrides/package-lock.json'
      - name: Install docs-overrides dependencies
        run: |
          cd docs-overrides
          npm ci
      - name: Build docs-overrides assets
        run: |
          cd docs-overrides
          npx gulp build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync doc environment
        run: uv sync --group docs
      - run: sudo apt update
      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          r-version: release
          use-public-rspm: true
      - name: Query R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          cache: true
          extra-packages: |
            any::pkgdown
          working-directory: './R'
      - run: Rscript -e 'pkgdown::build_site(pkg = "./R", preview = FALSE, override = list(destination = "../docs/api/rdocs"))'
      - name: Install Python documentation dependencies
        run: |
          # Get Spark version from pom.xml
          SPARK_VERSION=$(mvn help:evaluate -Dexpression=spark.version -q -DforceStdout)

          # Install pyspark matching Spark version (other deps handled by uv sync)
          uv pip install pyspark==$SPARK_VERSION

          # Install sedona with all optional dependencies for complete documentation
          uv pip install -e python/.[all]
      - name: Build Python API documentation with Sphinx
        env:
          CI: true
        run: |
          # Use uv run so sphinx-build from the virtual environment is on PATH
          uv run bash -c 'cd python/sedona/doc && make clean && make html'
          mkdir -p docs/api/pydocs
          cp -r python/sedona/doc/_build/html/* docs/api/pydocs/
      # Commit as the GitHub Actions bot so website-branch commits are
      # attributed to the Actions bot account rather than to whichever GitHub
      # user happens to own a placeholder email address.
      - run: git config --global user.name "github-actions[bot]"
      - run: git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: uv run mkdocs build
      - name: Deploy the doc to the website branch
        if: ${{ github.event_name != 'pull_request' && github.repository == 'apache/sedona' }}
        run: |
          if [[ "${GITHUB_REF##*/}" == "master" ]]; then
            git fetch origin website --depth=1
            uv run mike deploy latest-snapshot -b website -p
          elif [[ "${GITHUB_REF##*/}" =~ ^branch-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git fetch origin website --depth=1
            version="${GITHUB_REF##*/branch-}"
            uv run mike deploy --update-aliases "$version" latest -b website -p
            uv run mike set-default latest -T docs-overrides/redirect.html -b website -p
          fi
      - name: Mark archived documentation versions noindex
        # Only the current stable docs (/latest/) should be indexed by search
        # engines. Archived versions and the snapshot are frozen once deployed,
        # so we tag them with a crawlable <meta name="robots" content="noindex">
        # here rather than at build time. See tools/noindex_archived_docs.py.
        if: ${{ github.event_name != 'pull_request' && github.repository == 'apache/sedona' }}
        run: |
          git fetch origin website --depth=1
          git worktree add website-branch FETCH_HEAD
          python3 tools/noindex_archived_docs.py website-branch
          git -C website-branch config user.name "github-actions[bot]"
          git -C website-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git -C website-branch status --porcelain)" ]]; then
            git -C website-branch add -A
            git -C website-branch commit -m "Mark archived documentation versions noindex"
            git -C website-branch push origin HEAD:website
          else
            echo "Archived documentation already noindexed; nothing to commit."
          fi
      - run: mkdir staging
      - run: cp -r site/* staging/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-docs
          path: staging
      - name: Cache Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Cache Node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs-overrides/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('docs-overrides/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
