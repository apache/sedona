<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="slope-title slope-desc">
  <title id="slope-title">The highest canton is not the steepest</title>
  <desc id="slope-desc">Each dot represents one Swiss canton. The horizontal axis shows mean elevation. The vertical axis shows mean slope. Uri has the highest mean slope at 28.3 degrees. Valais has the highest mean elevation at 2,138 metres.</desc>
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #1c1c1c; }
    .kicker { fill: #ca463a; font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
    .title { font-size: 29px; font-weight: 700; letter-spacing: -0.45px; }
    .subtitle { fill: #59616d; font-size: 15px; }
    .grid, .tick line { stroke: #e5e9ee; stroke-width: 1; shape-rendering: crispEdges; }
    .tick text, .axis-label { fill: #59616d; font-size: 13px; }
    .axis-label { font-size: 15px; font-weight: 500; }
    .point { fill: #91a5bd; stroke: #ffffff; stroke-width: 1.5; }
    .point.uri { fill: #ca463a; }
    .point.valais { fill: #406b9d; }
    .guide-uri { stroke: #ca463a; }
    .guide-valais { stroke: #406b9d; }
    .guide-uri, .guide-valais { fill: none; stroke-width: 1.25; stroke-dasharray: 4 5; opacity: 0.28; stroke-linecap: butt; }
    .label-leader { stroke: #87919d; stroke-width: 1; stroke-linecap: butt; }
    .support-label { fill: #59616d; font-size: 13px; font-weight: 500; }
    .callout-name { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
    .callout-value { fill: #1c1c1c; font-size: 16px; font-weight: 700; }
    .leader { fill: none; stroke-width: 1.3; stroke-linecap: butt; }
  </style>
  <rect width="960" height="650" fill="#ffffff"/>
  <text class="kicker" x="60" y="26">MEAN ELEVATION AND SLOPE</text>
  <text class="title" x="60" y="58">The highest canton is not the steepest</text>
  <text class="subtitle" x="60" y="84">The same 62 tile and canton pairs show elevation and slope</text>
  <g aria-hidden="true">
    <g class="tick"><line x1="262.96" y1="116" x2="262.96" y2="566"/><text x="262.96" y="590" text-anchor="middle">500</text></g>
