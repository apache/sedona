<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="930" viewBox="0 0 960 930" role="img" aria-labelledby="relief-title relief-desc">
  <title id="relief-title">Elevation range for every Swiss canton</title>
  <desc id="relief-desc">Each line shows the lowest and highest elevation in one Swiss canton. The red dot shows the mean. The difference is 4,166 metres in Valais and 197 metres in Genève.</desc>
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #1c1c1c; }
    .kicker { fill: #ca463a; font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
    .title { font-size: 29px; font-weight: 700; letter-spacing: -0.45px; }
    .subtitle { fill: #59616d; font-size: 15px; }
    .grid, .tick line { stroke: #e5e9ee; stroke-width: 1; shape-rendering: crispEdges; }
    .tick text { fill: #59616d; font-size: 13px; }
    .axis-label { fill: #59616d; font-size: 15px; font-weight: 500; }
    .row-label { fill: #59616d; font-size: 14px; font-weight: 500; }
    .row-label.emphasis { fill: #1c1c1c; font-weight: 700; }
    .range { stroke: #aab3bd; stroke-width: 3; stroke-linecap: butt; }
    .endpoint { stroke: #1c1c1c; stroke-width: 1.75; stroke-linecap: butt; }
    .mean { fill: #ca463a; stroke: #ffffff; stroke-width: 1.5; }
    .leader { fill: none; stroke: #59616d; stroke-width: 1.25; stroke-linecap: butt; }
    .callout-name { fill: #ca463a; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
    .callout-value { fill: #1c1c1c; font-size: 15px; font-weight: 700; }
  </style>
  <rect width="960" height="930" fill="#ffffff"/>
  <text class="kicker" x="44" y="26">COPERNICUS 90 M ELEVATION</text>
  <text class="title" x="44" y="58">Elevation range for every Swiss canton</text>
  <text class="subtitle" x="44" y="84">Lowest, mean, and highest elevation from RS_ZonalStatsAll</text>
  <text class="subtitle" x="920" y="84" text-anchor="end">line = lowest to highest · <tspan fill="#ca463a" font-weight="700">red dot = mean</tspan></text>
  <g aria-hidden="true">
    <g class="tick"><line x1="220" y1="118" x2="220" y2="850"/><text x="220" y="876" text-anchor="middle">0</text></g>
