<text x="72" y="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="5" fill="#c05a10">APACHE SEDONA 1.9.1 · RASTER METADATA READER</text>
<text x="70" y="368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#241a10">Index a million rasters. <tspan fill="#e04a15">Open none.</tspan></text>
<text x="72" y="416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#5a4e42">The new geotiff.metadata reader turns bare files into a Sedona DataFrame — headers only.</text>

<g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">
<rect x="72" y="438" width="560" height="46" rx="9" fill="#f4eddd" stroke="#d9cdb4" stroke-width="1.4"/>
<text x="92" y="467" fill="#0f766e" font-size="16">sedona.read.<tspan fill="#241a10">format</tspan>(<tspan fill="#b45309">"geotiff.metadata"</tspan>).<tspan fill="#241a10">load</tspan>(<tspan fill="#b45309">"s3a://…"</tspan>)</text>
</g>
<text x="656" y="468" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#7a6c58">footprints · CRS · tiling · overviews — queryable</text>

