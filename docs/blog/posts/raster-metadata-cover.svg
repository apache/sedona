<!-- ===== MIDDLE BAND: title (no visuals behind) ===== -->
<rect x="0" y="244" width="1280" height="252" fill="#fffdf6"/>
<line x1="0" y1="244" x2="1280" y2="244" stroke="#ddd2bd" stroke-width="1.5"/>
