<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="title description">
  <title id="title">ST_SharedPaths ignores point-only intersections</title>
  <desc id="description">The first example shows two lines crossing at one interior point. The second shows two lines touching only at an endpoint. Neither contact contains a shared line segment, so both MultiLineString result elements are empty.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      text:not([fill]) { fill: #1f2937; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .input-a { fill: none; stroke: #2468b4; stroke-width: 6; stroke-linecap: round; }
      .input-b { fill: none; stroke: #d1495b; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 10 6; }
    </style>
    <marker id="arrow-a" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2468b4"/>
    </marker>
    <marker id="arrow-b" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d1495b"/>
    </marker>
  </defs>

  <rect width="940" height="440" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="bold">Point contact is not a shared path</text>
  <text x="470" y="53" text-anchor="middle" font-size="13" fill="#475569">ST_SharedPaths keeps only one-dimensional overlap</text>

  <rect x="34" y="82" width="406" height="245" rx="8" class="panel"/>
  <text x="237" y="110" text-anchor="middle" font-size="15" font-weight="bold">Interior crossing</text>
  <path d="M82 210 L385 210" class="input-a" marker-end="url(#arrow-a)"/>
  <path d="M237 285 L237 130" class="input-b" marker-end="url(#arrow-b)"/>
  <circle cx="237" cy="210" r="10" fill="#f4b942" stroke="#8a5a00" stroke-width="2"/>
  <text x="92" y="195" font-size="13" font-weight="bold" fill="#2468b4">A</text>
  <text x="250" y="148" font-size="13" font-weight="bold" fill="#c24150">B</text>
  <text x="237" y="310" text-anchor="middle" font-size="12" fill="#475569">Intersection = POINT (5 0)</text>

  <rect x="500" y="82" width="406" height="245" rx="8" class="panel"/>
  <text x="703" y="110" text-anchor="middle" font-size="15" font-weight="bold">Endpoint-only touch</text>
  <path d="M548 210 L703 210" class="input-a" marker-end="url(#arrow-a)"/>
  <path d="M703 210 L858 210" class="input-b" marker-end="url(#arrow-b)"/>
  <circle cx="703" cy="210" r="10" fill="#f4b942" stroke="#8a5a00" stroke-width="2"/>
  <text x="558" y="195" font-size="13" font-weight="bold" fill="#2468b4">A</text>
  <text x="829" y="195" font-size="13" font-weight="bold" fill="#c24150">B</text>
  <text x="703" y="310" text-anchor="middle" font-size="12" fill="#475569">Intersection = POINT (10 0)</text>

  <rect x="190" y="352" width="560" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="470" y="376" text-anchor="middle" font-size="13" font-weight="bold">GeometryCollection result for both cases</text>
  <text x="470" y="399" text-anchor="middle" font-size="12" fill="#475569">Element 0 = MULTILINESTRING EMPTY · Element 1 = MULTILINESTRING EMPTY</text>
</svg>
